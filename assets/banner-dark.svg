<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#091124"/>
      <stop offset="100%" stop-color="#060b18"/>
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#49C4FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#49C4FF"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="helixGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#49C4FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="helixGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 20px; fill: #94A3B8; }
    .role { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 700; font-size: 22px; fill: #38BDF8; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #34D399; letter-spacing: 0.5px; }
    .pill-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #CBD5E1; }
    .stat-num { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 22px; fill: #F8FAFC; }
    .stat-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 500; font-size: 11px; fill: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>

  <!-- Border Gradient Stroke -->
  <rect width="1198" height="378" x="1" y="1" rx="15" fill="none" stroke="url(#cyanPurpleGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38BDF8" fill-opacity="0.08" filter="url(#glowCyan)"/>
  <circle cx="1020" cy="180" r="160" fill="#8B5CF6" fill-opacity="0.12" filter="url(#glowPurple)"/>
  <circle cx="920" cy="280" r="120" fill="#49C4FF" fill-opacity="0.09" filter="url(#glowCyan)"/>

  <!-- Status Badge (Available for Sponsorship / Freelance) -->
  <g transform="translate(60, 48)">
    <rect width="365" height="32" rx="16" fill="url(#pillGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="18" cy="16" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="16" r="8" fill="#10B981" fill-opacity="0.2">
      <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="21" class="badge-text">DISPONIBLE · PATROCINIO SENA / FREELANCE</text>
  </g>

  <!-- Main Headline & Role -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" class="title">Kevin Gregorio Mora</text>
    <text x="0" y="38" class="role">Desarrollador Full-Stack Junior <tspan fill="#64748B" font-weight="400">|</tspan> <tspan fill="#A78BFA">Stack PERN</tspan></text>
    <text x="0" y="70" class="subtitle">Bases de datos relacionales limpias · Arquitecturas con Node.js &amp; PostgreSQL · React</text>
  </g>

  <!-- Tech Stack Pills Row -->
  <g transform="translate(60, 240)">
    <!-- Pill 1: PostgreSQL -->
    <g transform="translate(0, 0)">
      <rect width="125" height="34" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="20" cy="17" r="4" fill="#38BDF8"/>
      <text x="32" y="22" class="pill-text">PostgreSQL</text>
    </g>

    <!-- Pill 2: Node.js / Express -->
    <g transform="translate(135, 0)">
      <rect width="145" height="34" rx="8" fill="url(#cardGrad)" stroke="#22C55E" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="20" cy="17" r="4" fill="#22C55E"/>
      <text x="32" y="22" class="pill-text">Node.js · Express</text>
    </g>

    <!-- Pill 3: React / Next.js -->
    <g transform="translate(290, 0)">
      <rect width="135" height="34" rx="8" fill="url(#cardGrad)" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="20" cy="17" r="4" fill="#60A5FA"/>
      <text x="32" y="22" class="pill-text">React · Next.js</text>
    </g>

    <!-- Pill 4: Three.js 3D -->
    <g transform="translate(435, 0)">
      <rect width="130" height="34" rx="8" fill="url(#cardGrad)" stroke="#C084FC" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="20" cy="17" r="4" fill="#C084FC"/>
      <text x="32" y="22" class="pill-text">Three.js 3D</text>
    </g>

    <!-- Pill 5: DBML / SQL -->
    <g transform="translate(575, 0)">
      <rect width="115" height="34" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="20" cy="17" r="4" fill="#F59E0B"/>
      <text x="32" y="22" class="pill-text">DBML · SQL</text>
    </g>
  </g>

  <!-- Location & Academic info Footer -->
  <g transform="translate(60, 316)">
    <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-size="13" fill="#64748B">
      📍 <tspan fill="#94A3B8">Piedecuesta, Santander, Colombia</tspan>
      &nbsp;&nbsp;•&nbsp;&nbsp;
      🎓 <tspan fill="#94A3B8">SENA C.A.S.A. · ADSO (Ficha 3172526)</tspan>
      &nbsp;&nbsp;•&nbsp;&nbsp;
      ⚡ <tspan fill="#38BDF8">portafoleo-kevin-m.vercel.app</tspan>
    </text>
  </g>

  <!-- RIGHT SIDE: 3D Helix / Cybernetic Visual DNA Art -->
  <g transform="translate(970, 190)">
    <!-- Concentric tech orbit rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6,8" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4,6" stroke-opacity="0.4"/>

    <!-- Glowing 3D Double Helix Curves -->
    <!-- Strand 1 (Cyan) -->
    <path d="M -80 -140 C -30 -100, -30 -60, -75 -10 C -120 40, -120 90, -70 140" fill="none" stroke="url(#helixGrad1)" stroke-width="4.5" stroke-linecap="round" filter="url(#glowCyan)"/>
    <!-- Strand 2 (Purple) -->
    <path d="M 60 -140 C 10 -100, 10 -60, 65 -10 C 110 40, 110 90, 50 140" fill="none" stroke="url(#helixGrad2)" stroke-width="4.5" stroke-linecap="round" filter="url(#glowPurple)"/>

    <!-- Connecting Rungs (Base Pairs with glowing nodes) -->
    <!-- Rung 1 -->
    <line x1="-75" y1="-120" x2="52" y2="-120" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-75" cy="-120" r="5" fill="#49C4FF"/>
    <circle cx="52" cy="-120" r="5" fill="#C084FC"/>

    <!-- Rung 2 -->
    <line x1="-42" y1="-80" x2="22" y2="-80" stroke="#818CF8" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-42" cy="-80" r="4.5" fill="#38BDF8"/>
    <circle cx="22" cy="-80" r="4.5" fill="#A855F7"/>

    <!-- Rung 3 (Center crossover) -->
    <line x1="-72" y1="-10" x2="63" y2="-10" stroke="#C084FC" stroke-width="2.5" stroke-opacity="0.8"/>
    <circle cx="-72" cy="-10" r="6" fill="#49C4FF"/>
    <circle cx="63" cy="-10" r="6" fill="#8B5CF6"/>
    <circle cx="-4" cy="-10" r="3" fill="#FFFFFF"/>

    <!-- Rung 4 -->
    <line x1="-108" y1="50" x2="98" y2="50" stroke="#818CF8" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-108" cy="50" r="4.5" fill="#38BDF8"/>
    <circle cx="98" cy="50" r="4.5" fill="#A855F7"/>

    <!-- Rung 5 -->
    <line x1="-75" y1="110" x2="55" y2="110" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-75" cy="110" r="5" fill="#49C4FF"/>
    <circle cx="55" cy="110" r="5" fill="#C084FC"/>

    <!-- Floating Database Cylinders / Tech Nodes -->
    <g transform="translate(105, -70)">
      <rect width="44" height="48" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Database disk lines -->
      <ellipse cx="22" cy="12" rx="14" ry="5" fill="#38BDF8" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1"/>
      <path d="M 8 12 v 12 c 0 3 6 5 14 5 s 14 -2 14 -5 v -12" fill="none" stroke="#38BDF8" stroke-width="1"/>
      <path d="M 8 24 v 12 c 0 3 6 5 14 5 s 14 -2 14 -5 v -12" fill="none" stroke="#38BDF8" stroke-width="1"/>
    </g>

    <g transform="translate(-145, 60)">
      <rect width="44" height="48" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- React / Code atom symbol -->
      <circle cx="22" cy="24" r="5" fill="#8B5CF6"/>
      <ellipse cx="22" cy="24" rx="15" ry="6" fill="none" stroke="#A78BFA" stroke-width="1.2" transform="rotate(30 22 24)"/>
      <ellipse cx="22" cy="24" rx="15" ry="6" fill="none" stroke="#A78BFA" stroke-width="1.2" transform="rotate(-30 22 24)"/>
    </g>

    <!-- Star particles -->
    <circle cx="-130" cy="-90" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="120" cy="80" r="2" fill="#38BDF8" opacity="0.9"/>
    <circle cx="-40" cy="140" r="1.5" fill="#C084FC" opacity="0.7"/>
    <circle cx="80" cy="-130" r="1" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
