<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="60%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>

    <linearGradient id="pBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="pCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="pGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.5"/>
      <circle cx="30" cy="0" r="1" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Fira Code', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#pBg)"/>
  <rect width="800" height="450" rx="16" fill="url(#pGrid)"/>
  <rect width="798" height="448" x="1" y="1" rx="15" fill="none" stroke="url(#pBorder)" stroke-width="1.5"/>

  <!-- Glowing Orbs -->
  <circle cx="400" cy="225" r="160" fill="#38BDF8" fill-opacity="0.12" filter="url(#pGlow)"/>
  <circle cx="480" cy="210" r="140" fill="#8B5CF6" fill-opacity="0.12" filter="url(#pGlow)"/>

  <!-- Orbit Rings -->
  <ellipse cx="400" cy="225" rx="280" ry="130" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,8" transform="rotate(-15 400 225)"/>
  <ellipse cx="400" cy="225" rx="220" ry="90" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,6" transform="rotate(25 400 225)"/>

  <!-- 3D Helix Structure in Center -->
  <g transform="translate(400, 225)">
    <!-- Helix Back Strands -->
    <path d="M -160 -120 Q -80 -40, 0 -60 T 160 20" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
    <path d="M -160 60 Q -80 140, 0 100 T 160 -20" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Connecting Rungs -->
    <line x1="-120" y1="-85" x2="-100" y2="70" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="-120" cy="-85" r="4" fill="#38BDF8"/>
    <circle cx="-100" cy="70" r="4" fill="#C084FC"/>

    <line x1="-60" y1="-50" x2="-40" y2="105" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="-60" cy="-50" r="5" fill="#38BDF8"/>
    <circle cx="-40" cy="105" r="5" fill="#EC4899"/>

    <line x1="0" y1="-60" x2="20" y2="90" stroke="#C084FC" stroke-width="2.5" stroke-opacity="0.8"/>
    <circle cx="0" cy="-60" r="6" fill="#38BDF8" filter="url(#pGlow)"/>
    <circle cx="20" cy="90" r="6" fill="#C084FC" filter="url(#pGlow)"/>

    <line x1="60" y1="-30" x2="80" y2="40" stroke="#818CF8" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="60" cy="-30" r="5" fill="#38BDF8"/>
    <circle cx="80" cy="40" r="5" fill="#A855F7"/>

    <line x1="120" y1="5" x2="140" y2="-10" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="120" cy="5" r="4" fill="#38BDF8"/>
    <circle cx="140" cy="-10" r="4" fill="#C084FC"/>

    <!-- Main Helix Front Glowing Strands -->
    <path d="M -160 -60 C -90 -120, -50 40, 20 90 C 80 130, 130 -20, 170 30" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#pGlow)"/>
    <path d="M -160 90 C -110 30, -40 -120, 0 -60 C 50 10, 110 140, 170 -40" fill="none" stroke="url(#purpleGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#pGlow)"/>
  </g>

  <!-- Left Glass Card: Interactive Features -->
  <g transform="translate(40, 45)">
    <rect width="260" height="360" rx="14" fill="url(#pCard)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <rect width="258" height="3" x="1" y="1" rx="1.5" fill="url(#cyanGrad)"/>

    <g transform="translate(24, 30)">
      <text x="0" y="0" class="mono" font-size="11" fill="#38BDF8" font-weight="700">PORTAFOLIO WEB 3D</text>
      <text x="0" y="26" class="sans" font-size="20" fill="#FFFFFF" font-weight="800">ADN Helix 3D</text>
      <text x="0" y="48" class="sans" font-size="13" fill="#94A3B8">Three.js + React Interactivo</text>

      <line x1="0" y1="65" x2="210" y2="65" stroke="#334155" stroke-width="1"/>

      <!-- Features list -->
      <g transform="translate(0, 85)">
        <circle cx="6" cy="6" r="4" fill="#38BDF8"/>
        <text x="18" y="10" class="sans" font-size="12" fill="#E2E8F0" font-weight="600">Three.js + React Fiber</text>
        <text x="18" y="25" class="sans" font-size="11" fill="#64748B">Cámara orbital &amp; shaders 60FPS</text>
      </g>

      <g transform="translate(0, 135)">
        <circle cx="6" cy="6" r="4" fill="#A855F7"/>
        <text x="18" y="10" class="sans" font-size="12" fill="#E2E8F0" font-weight="600">Navegación Helicoidal</text>
        <text x="18" y="25" class="sans" font-size="11" fill="#64748B">Tarjetas 3D en espiral continua</text>
      </g>

      <g transform="translate(0, 185)">
        <circle cx="6" cy="6" r="4" fill="#10B981"/>
        <text x="18" y="10" class="sans" font-size="12" fill="#E2E8F0" font-weight="600">Dark / Glassmorphism</text>
        <text x="18" y="25" class="sans" font-size="11" fill="#64748B">Paleta obsidian &amp; neón cyan</text>
      </g>

      <!-- Pill Button -->
      <g transform="translate(0, 245)">
        <rect width="212" height="34" rx="8" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1"/>
        <text x="106" y="22" class="sans" font-size="12" fill="#38BDF8" font-weight="700" text-anchor="middle">⚡ portafoleo-kevin-m.vercel.app</text>
      </g>
    </g>
  </g>

  <!-- Right Glass Card: Tech Metrics -->
  <g transform="translate(530, 70)">
    <rect width="230" height="150" rx="14" fill="url(#pCard)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>
    <g transform="translate(20, 28)">
      <text x="0" y="0" class="sans" font-size="11" fill="#A78BFA" font-weight="700" text-transform="uppercase" letter-spacing="1">Rendimiento</text>
      <text x="0" y="32" class="sans" font-size="28" fill="#F8FAFC" font-weight="800">60 FPS</text>
      <text x="0" y="52" class="sans" font-size="12" fill="#94A3B8">WebGL render loop fluido</text>
      <rect x="0" y="65" width="190" height="6" rx="3" fill="#1E293B"/>
      <rect x="0" y="65" width="180" height="6" rx="3" fill="url(#cyanGrad)"/>
      <text x="0" y="90" class="mono" font-size="11" fill="#34D399">✓ 100% Responsive &amp; Touch</text>
    </g>
  </g>

  <g transform="translate(530, 240)">
    <rect width="230" height="145" rx="14" fill="url(#pCard)" stroke="#EC4899" stroke-width="1" stroke-opacity="0.3"/>
    <g transform="translate(20, 25)">
      <text x="0" y="0" class="sans" font-size="11" fill="#F472B6" font-weight="700" text-transform="uppercase" letter-spacing="1">Stack Clave</text>
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="85" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
        <text x="42" y="17" class="sans" font-size="11" fill="#E2E8F0" text-anchor="middle">React 18</text>

        <rect x="95" y="0" width="90" height="26" rx="6" fill="#1E293B" stroke="#A78BFA" stroke-width="0.8"/>
        <text x="140" y="17" class="sans" font-size="11" fill="#E2E8F0" text-anchor="middle">Three.js 3D</text>
      </g>
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="95" height="26" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="0.8"/>
        <text x="47" y="17" class="sans" font-size="11" fill="#E2E8F0" text-anchor="middle">Tailwind CSS</text>

        <rect x="105" y="0" width="80" height="26" rx="6" fill="#1E293B" stroke="#F472B6" stroke-width="0.8"/>
        <text x="145" y="17" class="sans" font-size="11" fill="#E2E8F0" text-anchor="middle">Vercel</text>
      </g>
      <text x="0" y="102" class="mono" font-size="11" fill="#94A3B8">🚀 Deploy automatizado</text>
    </g>
  </g>
</svg>
